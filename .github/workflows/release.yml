name: Release Python distributions

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  UV_NO_PROGRESS: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
      - run: uv lock --check
      - run: uv sync --locked --all-packages --dev
      - name: Verify exact release tag and synchronized versions
        run: uv run --frozen python scripts/ci/validate_release_tag.py --tag "$GITHUB_REF_NAME"
      - run: uv run --frozen ruff check .
      - run: uv run --frozen mypy
      - run: uv run --frozen pytest
      - run: uv build --all-packages --no-sources --no-create-gitignore --out-dir workspace-dist
      - name: Validate all workspace artifacts
        run: uv run --frozen python scripts/ci/smoke_installed_distribution.py --dist workspace-dist
      - name: Select the five v0.1 public distributions
        run: |
          mkdir dist
          cp workspace-dist/dutchmate_core-* dist/
          cp workspace-dist/dutchmate_cli-* dist/
          cp workspace-dist/dutchmate_service-* dist/
          cp workspace-dist/dutchmate_mcp_server-* dist/
          cp workspace-dist/dutchmate-[0-9]* dist/
      - name: Validate the public release artifact set
        run: >-
          uv run --frozen python scripts/ci/smoke_installed_distribution.py
          --dist dist --public-release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-release-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-release-distributions
          path: dist
      - name: Publish retained artifacts to TestPyPI in dependency order
        env:
          UV_PUBLISH_URL: https://test.pypi.org/legacy/
          UV_PUBLISH_CHECK_URL: https://test.pypi.org/simple/
        run: |
          uv publish --trusted-publishing always dist/dutchmate_core-*
          uv publish --trusted-publishing always \
            dist/dutchmate_cli-* \
            dist/dutchmate_service-* \
            dist/dutchmate_mcp_server-*
          uv publish --trusted-publishing always dist/dutchmate-[0-9]*

  verify-testpypi:
    needs: publish-testpypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-release-distributions
          path: dist
      - name: Verify TestPyPI exposes the exact accepted files and digests
        run: >-
          python scripts/ci/verify_index_artifacts.py
          --dist dist
          --index-url https://test.pypi.org

  publish-pypi:
    needs: verify-testpypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-release-distributions
          path: dist
      - name: Publish retained artifacts to PyPI in dependency order
        run: |
          uv publish --trusted-publishing always dist/dutchmate_core-*
          uv publish --trusted-publishing always \
            dist/dutchmate_cli-* \
            dist/dutchmate_service-* \
            dist/dutchmate_mcp_server-*
          uv publish --trusted-publishing always dist/dutchmate-[0-9]*
