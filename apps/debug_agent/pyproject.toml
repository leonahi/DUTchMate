[project]
name = "dutchmate-debug-agent"
version = "0.1.0"
description = "Bounded Debug Agent evidence and analysis adapters for DUTchMate."
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Nahit Pawar" }]
dependencies = ["dutchmate-core==0.1.0", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/leonahi/DUTchMate"
Repository = "https://github.com/leonahi/DUTchMate"
Issues = "https://github.com/leonahi/DUTchMate/issues"

[project.scripts]
dutchmate-debug = "dutchmate_debug_agent.cli:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12"]
build-backend = "uv_build"
