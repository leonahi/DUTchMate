[project]
name = "dutchmate-cli"
version = "0.1.0"
description = "DUTchMate command-line interface."
requires-python = ">=3.10"
dependencies = [
  "dutchmate-core",
  "httpx>=0.27",
  "typer>=0.12",
]

[project.scripts]
dutchmate = "dutchmate_cli.main:app"
dm = "dutchmate_cli.main:app"

[build-system]
requires = ["uv_build>=0.11.26,<0.12"]
build-backend = "uv_build"
