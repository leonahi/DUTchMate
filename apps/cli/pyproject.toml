[project]
name = "dutchmate-cli"
version = "0.1.0"
description = "DUTchMate command-line interface."
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Nahit Pawar" }]
dependencies = [
  "dutchmate-core==0.1.0",
  "httpx>=0.27",
  "tomli>=2.0; python_version < '3.11'",
  "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/leonahi/DUTchMate"
Repository = "https://github.com/leonahi/DUTchMate"
Issues = "https://github.com/leonahi/DUTchMate/issues"

[build-system]
requires = ["uv_build>=0.11.26,<0.12"]
build-backend = "uv_build"
