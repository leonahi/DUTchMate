[project]
name = "dutchmate-cli"
version = "0.1.0"
description = "DUTchMate command-line interface."
requires-python = ">=3.10"
dependencies = [
  "dutchmate-core==0.1.0",
  "httpx>=0.27",
  "tomli>=2.0; python_version < '3.11'",
  "typer>=0.12",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12"]
build-backend = "uv_build"
