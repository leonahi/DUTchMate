[project]
name = "dutchmate-service"
version = "0.1.0"
description = "DUTchMate Device Core Service."
requires-python = ">=3.10"
dependencies = [
  "dutchmate-core",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.scripts]
dutchmate-service = "dutchmate_service.main:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12"]
build-backend = "uv_build"
