[project]
name = "dutchmate-workspace"
version = "0.1.0"
description = "Workspace root for DUTchMate."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "jsonschema>=4.22",
  "mcp>=2.0,<3",
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "uvicorn>=0.30",
]

[tool.uv.workspace]
members = [
  "core",
  "packages/dutchmate",
  "apps/cli",
  "apps/service",
  "apps/mcp_server",
  "apps/debug_agent",
]

[tool.uv.sources]
dutchmate = { workspace = true }
dutchmate-core = { workspace = true }
dutchmate-cli = { workspace = true }
dutchmate-service = { workspace = true }
dutchmate-mcp-server = { workspace = true }
dutchmate-debug-agent = { workspace = true }

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py310"
src = [
  "core/src",
  "packages/dutchmate/src",
  "apps/cli/src",
  "apps/service/src",
  "apps/mcp_server/src",
  "apps/debug_agent/src",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = [
  "core/src",
  "packages/dutchmate/src",
  "apps/cli/src",
  "apps/service/src",
  "apps/mcp_server/src",
  "apps/debug_agent/src",
]
testpaths = [
  "apps/cli/tests",
  "apps/service/tests",
  "apps/mcp_server/tests",
  "apps/debug_agent/tests",
  "tests",
]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
files = [
  "core/src",
  "packages/dutchmate/src",
  "apps/cli/src",
  "apps/service/src",
  "apps/mcp_server/src",
  "apps/debug_agent/src",
]
